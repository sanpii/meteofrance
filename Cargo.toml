[package]
name = "meteofrance"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Client for for Météo-France API"
repository = "https://github.com/sanpii/meteofrance"

[dependencies]
jiff = "0.2"
thiserror = "2.0"

[dependencies.reqwest]
version = "0.13"
features = ["blocking", "query", "json"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies]
serde_json = "1.0"
